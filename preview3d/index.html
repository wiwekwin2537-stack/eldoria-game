<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Eldoria • ต้นแบบ 3D แยก v0.3</title>
<meta name="theme-color" content="#182e2b"><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c9d8c9;color:#fff8e5;font-family:Tahoma,system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #bda87555;background:#1c3433e8;border-radius:10px;padding:10px 15px;min-height:44px}button:hover,button[aria-pressed=true]{background:#bba26a;color:#142a27}button:focus-visible{outline:3px solid #fff5c9;outline-offset:3px}.panel{background:#142e2ce8;border:1px solid #e7d1a535;box-shadow:0 12px 40px #152c2930;backdrop-filter:blur(12px)}header{position:absolute;top:max(18px,env(safe-area-inset-top));left:20px;padding:17px 22px;border-radius:16px;pointer-events:none}small,.eyebrow{color:#d9c699;font-size:11px;letter-spacing:2px}h1{font-family:Georgia,serif;letter-spacing:3px;font-size:28px;margin:4px 0}header p{margin:0;font-size:12px;color:#dce3d5}.badge{position:absolute;right:20px;top:20px;padding:13px 16px;border-radius:12px;max-width:260px;font-size:12px;line-height:1.7}.badge strong{color:#e9c77d}nav{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:16px;white-space:nowrap}.controls{position:absolute;right:20px;bottom:100px;display:flex;flex-direction:column;gap:7px}.hint{position:absolute;bottom:100px;left:20px;color:#193c34;font-size:12px;background:#fff6e4dc;padding:10px 14px;border-radius:10px;max-width:360px}#status{position:absolute;bottom:8px;left:20px;color:#24493d;font-size:10px}#error{position:absolute;inset:30% 10%;background:#182e2bf2;border-radius:20px;padding:25px;text-align:center;z-index:10}#error[hidden]{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:700px){header{top:10px;left:10px;padding:10px 14px}h1{font-size:20px}.badge{right:10px;top:10px;max-width:158px;padding:8px;font-size:10px}.hint{left:10px;bottom:92px;max-width:260px;font-size:10px}.controls{right:10px;bottom:88px}nav{bottom:20px;gap:4px;padding:5px}nav button{font-size:11px;padding:8px 10px}#status{left:10px;font-size:9px}}
@media(max-height:450px){header{padding:8px 14px}header p{display:none}.badge{font-size:10px;padding:8px}nav{bottom:12px}.hint{bottom:78px}.controls{bottom:78px}h1{font-size:20px}}

#walkpad{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:100px;width:112px;height:112px;border:2px solid #e4d6af99;border-radius:50%;background:#172f2c99;touch-action:none;user-select:none}#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:#dec38ee0;transform:translate(-50%,-50%);pointer-events:none}#walkpad[hidden],#run[hidden]{display:none}#run{position:absolute;right:75px;bottom:110px}body.walking .hint{left:150px;max-width:290px}body.walking nav{max-width:calc(100vw - 12px);overflow-x:auto}@media(max-width:700px){nav{gap:2px}nav button{padding:8px 6px;font-size:10px}body.walking .hint{left:140px;bottom:160px;max-width:190px}#run{right:65px;bottom:100px}}
#target-info{position:absolute;left:50%;top:110px;transform:translateX(-50%);max-width:90vw;width:max-content;padding:10px 14px;border-radius:10px;font-size:12px;pointer-events:none}#target-info[hidden]{display:none}@media(max-height:450px){#target-info{top:75px;font-size:10px}}
</style></head><body>
<canvas id="scene" aria-label="ฉากสามมิติเมืองเอลโดเรีย ต้นแบบดูภาพและขนาดแมพ"></canvas>
<header class="panel"><span class="eyebrow">ELDORIA CHRONICLES</span><h1>เอลโดเรีย · 3D</h1><p>เมืองเดิมในโลกที่กว้างขึ้น</p></header>
<aside class="badge panel"><strong>เดินและตรวจเป้า v0.3</strong><br>แยกจากเกม 2D และเซฟจริง<br>เดินสำรวจได้ · ยังไม่เชื่อมต่อสู้และเซฟ</aside>
<div class="hint" id="hint">ลากเพื่อหมุนมุมมอง · เลื่อนล้อเพื่อซูม<br>ใช้ปุ่มด้านล่างสำรวจเมือง ป่า และโมเดล</div>
<nav class="panel" aria-label="เลือกบริเวณ"><button data-view="town" aria-pressed="true">เมืองเดิม</button><button data-view="forest" aria-pressed="false">พื้นที่ขยาย</button><button data-view="models" aria-pressed="false">ดูโมเดล</button><button data-view="walk" aria-pressed="false">เดินสำรวจ</button><button id="bounds" aria-pressed="false">ขอบเขตแมพ</button></nav>
<div class="controls"><button id="plus" aria-label="ซูมเข้า">＋</button><button id="minus" aria-label="ซูมออก">−</button><button id="reset" aria-label="คืนมุมมอง">↺</button></div>
<div id="walkpad" role="group" aria-label="จอยเดินสำรวจ" hidden><span id="knob"></span></div><button id="run" aria-pressed="false" hidden>วิ่ง</button>
<div id="target-info" class="panel" role="status" hidden></div>
<div id="status" role="status">กำลังเตรียมฉาก 3D…</div><div id="error" role="alert" hidden></div>
<script src="/vendor/three.min.js"></script><script type="module" src="/app.js"></script>
</body></html>
